<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Future humans and AI collaboration -->
  <!-- Human figure -->
  <circle cx="25" cy="25" r="8" fill="none" stroke="#25c2a0" stroke-width="2"/>
  <line x1="25" y1="33" x2="25" y2="50" stroke="#25c2a0" stroke-width="2"/>
  <line x1="20" y1="40" x2="30" y2="40" stroke="#25c2a0" stroke-width="2"/>
  <line x1="20" y1="60" x2="25" y2="50" stroke="#25c2a0" stroke-width="2"/>
  <line x1="30" y1="60" x2="25" y2="50" stroke="#25c2a0" stroke-width="2"/>
  
  <!-- Robot figure -->
  <rect x="65" y="20" width="15" height="20" rx="3" fill="none" stroke="#25c2a0" stroke-width="2"/>
  <line x1="65" y1="30" x2="50" y2="30" stroke="#25c2a0" stroke-width="2"/>
  <line x1="80" y1="30" x2="90" y2="30" stroke="#25c2a0" stroke-width="2"/>
  <line x1="70" y1="40" x2="70" y2="55" stroke="#25c2a0" stroke-width="2"/>
  <line x1="75" y1="40" x2="75" y2="55" stroke="#25c2a0" stroke-width="2"/>
  
  <!-- Collaboration symbol (plus sign) -->
  <line x1="45" y1="35" x2="55" y2="35" stroke="#25c2a0" stroke-width="3"/>
  <line x1="50" y1="30" x2="50" y2="40" stroke="#25c2a0" stroke-width="3"/>
  
  <!-- Future path indicator -->
  <path d="M25 70 Q50 60 75 70" stroke="#25c2a0" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <polygon points="73,67 75,72 77,67" fill="#25c2a0"/>
</svg>