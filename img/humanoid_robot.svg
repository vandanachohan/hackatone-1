<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Humanoid robot body -->
  <!-- Head -->
  <circle cx="50" cy="25" r="15" stroke="#25c2a0" stroke-width="2" fill="#f0f8ff"/>
  
  <!-- Body -->
  <rect x="35" y="40" width="30" height="30" rx="5" stroke="#25c2a0" stroke-width="2" fill="#f0f8ff"/>
  
  <!-- Arms -->
  <line x1="35" y1="50" x2="15" y2="50" stroke="#25c2a0" stroke-width="3"/>
  <line x1="65" y1="50" x2="85" y2="50" stroke="#25c2a0" stroke-width="3"/>
  
  <!-- Legs -->
  <line x1="40" y1="70" x2="40" y2="90" stroke="#25c2a0" stroke-width="3"/>
  <line x1="60" y1="70" x2="60" y2="90" stroke="#25c2a0" stroke-width="3"/>
  
  <!-- Eyes -->
  <circle cx="45" cy="22" r="2" fill="#25c2a0"/>
  <circle cx="55" cy="22" r="2" fill="#25c2a0"/>
  
  <!-- Engineering details -->
  <circle cx="50" cy="55" r="5" stroke="#25c2a0" stroke-width="1" fill="none"/>
  <path d="M45 55 L55 55 M50 50 L50 60" stroke="#25c2a0" stroke-width="1"/>
</svg>