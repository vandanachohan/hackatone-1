<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot arm with actuators -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#25c2a0" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Joints/actuators -->
  <circle cx="20" cy="50" r="10" fill="#25c2a0" fill-opacity="0.3" stroke="#25c2a0" stroke-width="2"/>
  <circle cx="40" cy="50" r="10" fill="#25c2a0" fill-opacity="0.3" stroke="#25c2a0" stroke-width="2"/>
  <circle cx="60" cy="50" r="10" fill="#25c2a0" fill-opacity="0.3" stroke="#25c2a0" stroke-width="2"/>
  <circle cx="80" cy="50" r="10" fill="#25c2a0" fill-opacity="0.3" stroke="#25c2a0" stroke-width="2"/>
  
  <!-- Gears inside actuators -->
  <circle cx="20" cy="50" r="5" stroke="#25c2a0" stroke-width="1" fill="none"/>
  <path d="M18 47 l4 0 l0 6 l-4 0 Z M17 48 l6 0 m-3 -3 l0 6" stroke="#25c2a0" stroke-width="1" fill="none"/>
  
  <circle cx="40" cy="50" r="5" stroke="#25c2a0" stroke-width="1" fill="none"/>
  <path d="M38 47 l4 0 l0 6 l-4 0 Z M37 48 l6 0 m-3 -3 l0 6" stroke="#25c2a0" stroke-width="1" fill="none"/>
  
  <circle cx="60" cy="50" r="5" stroke="#25c2a0" stroke-width="1" fill="none"/>
  <path d="M58 47 l4 0 l0 6 l-4 0 Z M57 48 l6 0 m-3 -3 l0 6" stroke="#25c2a0" stroke-width="1" fill="none"/>
  
  <circle cx="80" cy="50" r="5" stroke="#25c2a0" stroke-width="1" fill="none"/>
  <path d="M78 47 l4 0 l0 6 l-4 0 Z M77 48 l6 0 m-3 -3 l0 6" stroke="#25c2a0" stroke-width="1" fill="none"/>
  
  <!-- Motion arrows -->
  <line x1="10" y1="30" x2="30" y2="30" stroke="#25c2a0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="30" y1="70" x2="10" y2="70" stroke="#25c2a0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="50" y1="20" x2="50" y2="40" stroke="#25c2a0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="50" y1="60" x2="50" y2="80" stroke="#25c2a0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#25c2a0" />
    </marker>
  </defs>
</svg>