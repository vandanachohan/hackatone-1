<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot figure -->
  <circle cx="50" cy="30" r="15" stroke="#25c2a0" stroke-width="3" fill="none"/>
  <line x1="50" y1="45" x2="50" y2="70" stroke="#25c2a0" stroke-width="3"/>
  <line x1="40" y1="55" x2="60" y2="55" stroke="#25c2a0" stroke-width="3"/>
  <line x1="35" y1="85" x2="45" y2="75" stroke="#25c2a0" stroke-width="3"/>
  <line x1="65" y1="85" x2="55" y2="75" stroke="#25c2a0" stroke-width="3"/>

  <!-- Kinematic arrows around the robot -->
  <line x1="10" y1="20" x2="20" y2="20" stroke="#25c2a0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="10" y1="30" x2="20" y2="30" stroke="#25c2a0" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="10" y1="40" x2="20" y2="40" stroke="#25c2a0" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#25c2a0" />
    </marker>
  </defs>
</svg>