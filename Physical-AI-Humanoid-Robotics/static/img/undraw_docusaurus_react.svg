<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Central circle representing sensors -->
  <circle cx="50" cy="50" r="30" stroke="#25c2a0" stroke-width="3" fill="#f0f8ff"/>
  
  <!-- Multiple sensors around the circle -->
  <polygon points="50,20 55,30 45,30" fill="#25c2a0"/> <!-- Top sensor -->
  <polygon points="20,50 30,45 30,55" fill="#25c2a0"/> <!-- Left sensor -->
  <polygon points="80,50 70,45 70,55" fill="#25c2a0"/> <!-- Right sensor -->
  <polygon points="50,80 45,70 55,70" fill="#25c2a0"/> <!-- Bottom sensor -->
  
  <!-- Radar waves emanating from center -->
  <circle cx="50" cy="50" r="15" stroke="#25c2a0" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  <circle cx="50" cy="50" r="25" stroke="#25c2a0" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  <circle cx="50" cy="50" r="35" stroke="#25c2a0" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  
  <!-- Detection objects -->
  <circle cx="15" cy="15" r="5" stroke="#25c2a0" stroke-width="1" fill="none"/>
  <circle cx="80" cy="20" r="4" stroke="#25c2a0" stroke-width="1" fill="none"/>
  <circle cx="70" cy="75" r="3" stroke="#25c2a0" stroke-width="1" fill="none"/>
</svg>