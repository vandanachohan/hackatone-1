<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot head with AI elements -->
  <rect x="30" y="20" width="40" height="40" rx="5" stroke="#25c2a0" stroke-width="2" fill="#f0f8ff"/>
  
  <!-- Eyes -->
  <circle cx="40" cy="35" r="3" fill="#25c2a0"/>
  <circle cx="60" cy="35" r="3" fill="#25c2a0"/>
  
  <!-- AI neural connections -->
  <circle cx="20" cy="20" r="4" fill="#25c2a0"/>
  <circle cx="25" cy="40" r="3" fill="#25c2a0"/>
  <circle cx="40" cy="25" r="3" fill="#25c2a0"/>
  <circle cx="35" cy="15" r="2" fill="#25c2a0"/>
  <circle cx="50" cy="30" r="3" fill="#25c2a0"/>
  
  <!-- Neural connections -->
  <line x1="20" y1="20" x2="25" y2="40" stroke="#25c2a0" stroke-width="1"/>
  <line x1="25" y1="40" x2="40" y2="25" stroke="#25c2a0" stroke-width="1"/>
  <line x1="40" y1="25" x2="35" y2="15" stroke="#25c2a0" stroke-width="1"/>
  <line x1="35" y1="15" x2="50" y2="30" stroke="#25c2a0" stroke-width="1"/>
  
  <!-- Physical interaction elements -->
  <path d="M50 60 L50 80 M50 80 L40 70 M50 80 L60 70" stroke="#25c2a0" stroke-width="2" fill="none"/>
</svg>