<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot head -->
  <rect x="35" y="10" width="30" height="30" rx="5" stroke="#25c2a0" stroke-width="2" fill="#f0f8ff"/>
  
  <!-- Robot eyes -->
  <circle cx="45" cy="25" r="3" fill="#25c2a0"/>
  <circle cx="55" cy="25" r="3" fill="#25c2a0"/>
  
  <!-- Robot body -->
  <rect x="30" y="40" width="40" height="30" rx="5" stroke="#25c2a0" stroke-width="2" fill="#f0f8ff"/>
  
  <!-- Arms -->
  <line x1="30" y1="50" x2="15" y2="50" stroke="#25c2a0" stroke-width="3"/>
  <line x1="70" y1="50" x2="85" y2="50" stroke="#25c2a0" stroke-width="3"/>
  
  <!-- Legs -->
  <line x1="40" y1="70" x2="40" y2="85" stroke="#25c2a0" stroke-width="3"/>
  <line x1="60" y1="70" x2="60" y2="85" stroke="#25c2a0" stroke-width="3"/>
  
  <!-- AI Neural Network in background -->
  <circle cx="20" cy="20" r="3" fill="#25c2a0"/>
  <circle cx="25" cy="35" r="3" fill="#25c2a0"/>
  <circle cx="40" cy="30" r="3" fill="#25c2a0"/>
  <circle cx="35" cy="15" r="3" fill="#25c2a0"/>
  <circle cx="50" cy="20" r="3" fill="#25c2a0"/>
  
  <line x1="20" y1="20" x2="25" y2="35" stroke="#25c2a0" stroke-width="1"/>
  <line x1="25" y1="35" x2="40" y2="30" stroke="#25c2a0" stroke-width="1"/>
  <line x1="40" y1="30" x2="35" y2="15" stroke="#25c2a0" stroke-width="1"/>
  <line x1="35" y1="15" x2="50" y2="20" stroke="#25c2a0" stroke-width="1"/>
</svg>